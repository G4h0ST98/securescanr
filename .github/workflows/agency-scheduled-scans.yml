name: Agency Scheduled Scans
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scheduled-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled scans
        run: |
          curl -X POST https://api.webaudit.in/api/agency/run-scheduled \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
