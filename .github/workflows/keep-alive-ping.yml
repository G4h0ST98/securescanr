name: Keep-Alive Ping
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to prevent cold start
        run: |
          curl https://api.webaudit.in/ping \
            --fail \
            --silent \
            --show-error
